name: build-frontend-turborepo

on:
  pull_request:
    branches:
      - dev
      - 'hotfix-*'
    paths:
      - '/infraops-utils/msinfraops-dev-apps/code/**'
      - '!/infraops-utils/msinfraops-dev-apps/code/**.md'
    types:
      - closed
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs: 
  getting-app-names:
    name: Getting App Names
    if:
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infraops-utils/msinfraops-dev-apps/code/
    outputs:
      apps: ${{ steps.get-frontend-apps.outputs.apps }}
    steps:
      - name: Checkout dev
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Caching Packages
        run: |
          npm install
          
      - name: Checkout tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout hotfix branch
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Get Frontend App Names
        id: get-frontend-apps
        run: |
          APP_ARRAY=()
          for f in ./apps/*; do
            [ -e "$f" ] || continue
            APP_ARRAY+=("\"$f\"")
          done
          IFS=,
          JSON="[${APP_ARRAY[*]}]"
          echo "apps=$JSON" >> $GITHUB_OUTPUT
          echo $JSON

  upload-App-s3:
    name: Uploading to S3
    needs: getting-app-names
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infraops-utils/msinfraops-dev-apps/code/
    strategy:
      matrix:
        app: ${{ fromJSON(needs.getting-app-names.outputs.apps) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installing dependencies
        run: |
          pnpm install

      - name: Building frontend
        run: |
          pnpm turbo build --filter=${{ matrix.app }}

      - name: Assuming federated role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_FED_ROLE_ARN }}
          role-session-name: Federal

      - name: Zip built Apps
        run: |
          cd ./apps/${{ matrix.app }}
          zip -r ${{ matrix.app }}.zip build/

      - name: Uploading Apps (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          cd frontend/apps/${{ matrix.app }}
          aws s3 cp "${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/${{ vars.FOLDER_NAME}}/${{ matrix.app }}.zip

      - name: Uploading Apps (tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd frontend/apps/${{ matrix.app }}
          aws s3 cp "${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/${GITHUB_REF#refs/tags/}/${{ matrix.app }}.zip

      - name: Uploading Apps (hotfix)
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        run: |
          cd frontend/apps/${{ matrix.app }}
          aws s3 cp "${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/${GITHUB_REF#refs/heads/}/${{ matrix.app }}.zip 