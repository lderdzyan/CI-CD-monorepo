name: build-frontend-turborepo

on:
  pull_request:
    branches:
      - dev
      - 'hotfix-*'
    types:
      - closed
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read


jobs:
  check-conditions:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.logic.outputs.run_build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Logic
        id: logic
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Condition Met: Tag pushed"
            echo "run_build=true" >> $GITHUB_OUTPUT
          fi
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE" --quiet
          CHANGED=$(git diff --name-only origin/"$BASE"...HEAD | grep -v '\.md$' || true)

          if [[ -z "$CHANGED" ]]; then
            echo "No relevant changes found."
            echo "run_build=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [[ "$BASE" == "dev" ]]; then
            if echo "$CHANGED" | grep -q "frontend/"; then
              echo "Condition Met: Dev merge with backend changes"
              echo "run_build=true" >> $GITHUB_OUTPUT
            else
              echo "Condition Not Met: Dev merge but no backend changes"
              echo "run_build=false" >> $GITHUB_OUTPUT
            fi

          elif [[ "$BASE" == hotfix-* ]]; then
            echo "Condition Met: Hotfix merge with changes"
            echo "run_build=true" >> $GITHUB_OUTPUT
          
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi


  AppNames:
    needs: check-conditions 
    if: |
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && needs.check-conditions.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.get-frontend-apps.outputs.apps }}
    defaults:
      run:
        working-directory: ./frontend/
    steps:
      - name: Checkout dev
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Checkout tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout hotfix branch
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Get Frontend App Names
        id: get-frontend-apps
        run: |
          cd ./apps
          APP_ARRAY=()
          for f in *; do
            [ -e "$f" ] || continue
            APP_ARRAY+=("\"$f\"")
          done
          IFS=,
          JSON="[${APP_ARRAY[*]}]"
          echo "apps=$JSON" >> $GITHUB_OUTPUT
          echo $JSON

  AppToS3:
    needs: AppNames
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.AppNames.outputs.apps) }}
    defaults:
      run:
        working-directory: ./frontend/
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: |
          pnpm install

      - name: Build frontend
        run: |
          pnpm turbo build --filter=${{ matrix.app }}

      - name: Assume federated role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_FED_ROLE_ARN }}
          role-session-name: Federal

      - name: Zip built Apps
        run: |
          cd ./apps/${{ matrix.app }}/build
          cp ../bootstrapjs.sh .
          zip -r ${{ matrix.app }}.zip .

      - name: Deploy Apps (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 cp "./apps/${{ matrix.app }}/${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/dev/${{ matrix.app }}.zip

      - name: Deploy Apps (tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp "./apps/${{ matrix.app }}/${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/${GITHUB_REF#refs/tags/}/${{ matrix.app }}.zip

      - name: Deploy Apps (hotfix)
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        run: |
          aws s3 cp "./apps/${{ matrix.app }}/${{ matrix.app }}.zip" s3://${{ secrets.BUCKET_NAME }}/frontend/${GITHUB_REF#refs/heads/}/${{ matrix.app }}.zip 