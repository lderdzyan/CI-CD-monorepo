name: Check app npm packages for vulnerabilities

on: 
  pull_request:
    types:
      - ready_for_review

permissions:
  id-token: write
  contents: read

jobs: 
  vulnerabilities-scan:
    name: Vulnerabilities Scan
    runs-on: ubuntu-latest
    defaults:
      run:
          working-directory: ./backend
    steps:
        - uses: actions/checkout@v6

        - name: Set up node
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: ./backend/package-lock.json

        - name: Downloading NPM dependencies and auditing
          run: |
            WARNING_LINE=$(npm install | grep "vulnerabilities" || true)
            npm audit --json > audit_results.json || true  
            echo "Full npm audit output:"
            cat audit_results.json

            HIGH_SEVERITY=$(jq '.metadata.vulnerabilities.high' audit_results.json)
            CRITICAL_SEVERITY=$(jq '.metadata.vulnerabilities.critical' audit_results.json)

            echo "High vulnerabilities: $HIGH_SEVERITY"
            echo "Critical vulnerabilities: $CRITICAL_SEVERITY"

            if [ "$HIGH_SEVERITY" -gt 0 ] || [ "$CRITICAL_SEVERITY" -gt 0 ]; then
            echo "::warning ::$WARNING_LINE"
            npm audit || true
            fi

            if [ "$CRITICAL_SEVERITY" -gt 0 ]; then
            echo "Critical vulnerabilities detected! Failing workflow."
            exit 1
            fi
          shell: bash


        - name: Notify me on Slack (DM)
          if: failure()
          uses: actions/github-script@v7
          env:
            SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
            SLACK_USER_MAP: ${{ secrets.SLACK_USERS_ID}}
          with:
            script: |
              const token = process.env.SLACK_BOT_TOKEN;
              const map = JSON.parse(process.env.SLACK_USER_MAP);
              console.log(context.actor);
              const slackUserId = map[context.actor];
              if (!slackUserId) return;

              await fetch("https://slack.com/api/chat.postMessage", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  channel: slackUserId,
                  text: `Workflow failed\nRepo: ${context.repo.owner}/${context.repo.repo}\nActor: ${context.actor}`
                })
              });