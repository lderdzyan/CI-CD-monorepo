name: Check app npm packages for vulnerabilities

on: 
  pull_request:
    types:
      - ready_for_review

permissions:
  id-token: write
  contents: read

jobs: 
  vulnerabilities-scan:
    name: Vulnerabilities Scan
    runs-on: ubuntu-latest
    defaults:
      run:
          working-directory: ./backend
    steps:
        - uses: actions/checkout@v6

        - name: Set up node
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
            cache-dependency-path: /backend/package-lock.json

        - name: Downloading NPM dependencies and auditing
          run: |
            WARNING_LINE=$(npm install | grep "vulnerabilities" || true)
            npm audit --json > audit_results.json || true  
            echo "Full npm audit output:"
            cat audit_results.json

            HIGH_SEVERITY=$(jq '.metadata.vulnerabilities.high' audit_results.json)
            CRITICAL_SEVERITY=$(jq '.metadata.vulnerabilities.critical' audit_results.json)

            echo "inch new change $HIGH_SEVERITY"
            echo "Critical vulnerabilities: $CRITICAL_SEVERITY"

            if [ "$HIGH_SEVERITY" -gt 0 ] || [ "$CRITICAL_SEVERITY" -gt 0 ]; then
            echo "::warning ::$WARNING_LINE"
            npm audit || true
            fi

            if [ "$CRITICAL_SEVERITY" -gt 0 ]; then
            echo "Critical vulnerabilities detected! Failing workflow."
            exit 1
            fi
          shell: bash


        - name: Get Slack UserID
          if: failure()       
          id: get_slack_id
          run: |
            map='${{ secrets.SLACK_USERS_ID }}'
            actor=$GITHUB_ACTOR
            slackUserId=$(echo "$map" | jq -r --arg user "$actor" '.[$user]')
            if [ -z "$slackUserId" ]; then
              echo "No Slack mapping for $actor"
              exit 0
            fi
            echo "SLACK_USER_ID=$slackUserId" >> $GITHUB_ENV
          shell: bash

        - name: Post text to Slack
          if: ${{ steps.get_slack_id.conclusion == 'success' }}
          uses: slackapi/slack-github-action@v2.1.1
          env:
            SLACK_USER_ID: ${{ env.SLACK_USER_ID }}
          with:
            method: chat.postMessage
            token: ${{ secrets.SLACK_BOT_TOKEN }}
            payload: |
              channel: ${{ env.SLACK_USER_ID }}
              text: "Workflow failed! Notifying user."
