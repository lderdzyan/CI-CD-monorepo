name: Build Serverless Backend Lambda Functions

on:
  pull_request:
    branches:
      - dev
      - "hotfix-*"
    types:
      - closed
  push:
    tags:
      - "v*"
permissions:
  contents: write
  id-token: write

jobs:
  check-conditions :
    name: Checking Changes
    if: |
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && needs.check-conditions.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    outputs:
      run_build: ${{ steps.logic.outputs.run_build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Logic
        id: logic
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Condition Met: Tag pushed"
            echo "run_build=true" >> $GITHUB_OUTPUT
          fi
          BASE="${{ github.base_ref }}"
          git fetch origin "$BASE" --quiet
          CHANGED=$(git diff --name-only origin/"$BASE"...HEAD | grep -v '\.md$' || true)

          if [[ -z "$CHANGED" ]]; then
            echo "No relevant changes found."
            echo "run_build=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [[ "$BASE" == "dev" ]]; then
            if echo "$CHANGED" | grep -q "backend/"; then
              echo "Condition Met: Dev merge with backend changes"
              echo "run_build=true" >> $GITHUB_OUTPUT
            else
              echo "Condition Not Met: Dev merge but no backend changes"
              echo "run_build=false" >> $GITHUB_OUTPUT
            fi

          elif [[ "$BASE" == hotfix-* ]]; then
            echo "Condition Met: Hotfix merge with changes"
            echo "run_build=true" >> $GITHUB_OUTPUT
          
          else
            echo "run_build=false" >> $GITHUB_OUTPUT
          fi


  getting-lambda-functions-names:
    needs: check-conditions 
    if: |
      ((github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) && needs.check-conditions.outputs.run_build == 'true'
    defaults:
      run:
        working-directory: ./backend
    runs-on: ubuntu-latest
    outputs:
      lambda-names: ${{ steps.lambda-names.outputs.names }}
    steps:
      - name: Checkout dev
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Checkout tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Checkout hotfix branch
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Create Release for Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Caching Packages
        run: |
          npm install

      - name: Grubing functions names
        id: lambda-names
        run: |
          rm -r node_modules/
          LAMBDA_ARRAY=()
          for f in ./* ; do
            [ -d "$f" ] || continue
            FILE=$(basename "$f")
            NAME="${FILE}"
            LAMBDA_ARRAY+=("\"$NAME\"")
          done
          IFS=,
          JSON="[${LAMBDA_ARRAY[*]}]"
          echo "names=$JSON" >> $GITHUB_OUTPUT
          echo $JSON

  upload-function-s3:
    name: Uploading to S3
    needs: getting-lambda-functions-names
    defaults:
      run:
        working-directory: ./backend    
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda: ${{ fromJSON(needs.getting-lambda-functions-names.outputs.lambda-names) }}
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout dev
        if: github.ref == 'refs/heads/dev'
        uses: actions/checkout@v6
        with:
          ref: dev
      - name: Checkout release tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          
      - name: Checkout hotfix branch
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Installing node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Installing Infra dependencies
        run: |
          npm install

      - name: Building Lambdas
        run: |
          npx sls package

      - name: Assuming federated role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_FED_ROLE_ARN }}
          role-session-name: Federal

      - name: Uploading Lambda (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          aws s3 cp "./.serverless/${{ matrix.lambda }}.zip" s3://${{ secrets.BUCKET_NAME }}/backend/dev/${{ matrix.lambda }}.zip

      - name: Uploading Lambda (release tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp "./.serverless/${{ matrix.lambda }}.zip" s3://${{ secrets.BUCKET_NAME }}/backend/${GITHUB_REF#refs/tags/}/${{ matrix.lambda }}.zip

      - name: Uploading Lambda (hotfix)
        if: startsWith(github.ref, 'refs/heads/hotfix-')
        run: |
          aws s3 cp "./.serverless/${{ matrix.lambda }}.zip" s3://${{ secrets.BUCKET_NAME }}/backend/${GITHUB_REF#refs/heads/}/${{ matrix.lambda }}.zip