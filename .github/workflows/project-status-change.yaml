name: Auto update project status from estimate

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: 'Project number to scan'
        required: true
        default: '1'
  schedule:
    - cron: "*/5 * * * *" 

permissions:
  repository-projects: write
  contents: read

jobs:
  auto-move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PROJECT_NUMBER = parseInt(
            context.payload.inputs?.project_number || '1',
            10
            );
            const STATUS_FIELD = "Status";
            const ESTIMATE_FIELD = "Estimate";
            const FROM_STATUS = "Need Estimation";
            const TO_STATUS = "To Do";

            const owner = context.repo.owner;

            const projectRes = await github.graphql(`
              query ($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    items(first: 50) {
                      nodes {
                        id
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field { ... on ProjectV2FieldCommon { name } }
                              name
                            }
                            ... on ProjectV2ItemFieldNumberValue {
                              field { ... on ProjectV2FieldCommon { name } }
                              number
                            }
                            ... on ProjectV2ItemFieldTextValue {
                              field { ... on ProjectV2FieldCommon { name } }
                              text
                            }
                          }
                        }
                      }
                    }
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                        ... on ProjectV2Field {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, number: PROJECT_NUMBER });

            const project = projectRes.user.projectV2;
            if (!project) {
              console.log("Project not found");
              return;
            }

            const statusField = project.fields.nodes.find(f => f.name === STATUS_FIELD);
            const todoOption = statusField?.options?.find(o => o.name === TO_STATUS);

            if (!statusField || !todoOption) {
              console.log("Status field or To Do option not found");
              return;
            }

            for (const item of project.items.nodes) {
              let statusValue = null;
              let estimateValue = null;

              for (const v of item.fieldValues.nodes) {
                const fieldName = v.field?.name;
                if (fieldName === STATUS_FIELD) statusValue = v.name;
                if (fieldName === ESTIMATE_FIELD) {
                    // Handle both number fields and text-based estimate fields
                    estimateValue = v.number !== undefined ? v.number : v.text;
                }
              }

              if (statusValue === FROM_STATUS && estimateValue !== null && estimateValue !== "") {
                await github.graphql(`
                  mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }
                    ) {
                      projectV2Item { id }
                    }
                  }
                `, {
                  projectId: project.id,
                  itemId: item.id,
                  fieldId: statusField.id,
                  optionId: todoOption.id
                });
                console.log(`Item ${item.id}: Status updated to To Do`);
              }
            }