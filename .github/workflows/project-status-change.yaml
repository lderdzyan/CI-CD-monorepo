name: Auto update project status from estimate

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: 'Project number to scan'
        required: true
        default: '1'
  schedule:
    - cron: "*/5 * * * *" 

permissions:
  repository-projects: write
  contents: read

jobs:
  auto-move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          # IMPORTANT: Use the PAT secret here
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const PROJECT_NUMBER = 1; 
            const STATUS_FIELD = "Status";
            const ESTIMATE_FIELD = "Estimate";
            const FROM_STATUS = "Need Estimation";
            const TO_STATUS = "To Do";

            const owner = context.repo.owner;

            // 1. Fetch Project and Fields
            const projectRes = await github.graphql(`
              query ($owner: String!, $number: Int!) {
                repositoryOwner(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                        ... on ProjectV2Field {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, number: PROJECT_NUMBER });

            const project = projectRes.repositoryOwner.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === STATUS_FIELD);
            const estimateField = project.fields.nodes.find(f => f.name === ESTIMATE_FIELD);
            const todoOption = statusField?.options?.find(o => o.name === TO_STATUS);

            if (!statusField || !todoOption) {
              console.log("Could not find Status field or 'To Do' option.");
              return;
            }

            // 2. Get the specific item that was edited
            const itemId = context.payload.projects_v2_item.node_id;

            const itemRes = await github.graphql(`
              query ($item: ID!) {
                node(id: $item) {
                  ... on ProjectV2Item {
                    fieldValues(first: 20) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          field { ... on ProjectV2FieldCommon { name } }
                          name
                        }
                        ... on ProjectV2ItemFieldNumberValue {
                          field { ... on ProjectV2FieldCommon { name } }
                          number
                        }
                      }
                    }
                  }
                }
              }
            `, { item: itemId });

            let currentStatus = null;
            let currentEstimate = null;

            for (const val of itemRes.node.fieldValues.nodes) {
              if (val.field?.name === STATUS_FIELD) currentStatus = val.name;
              if (val.field?.name === ESTIMATE_FIELD) currentEstimate = val.number;
            }

            console.log(`Current Status: ${currentStatus}, Estimate: ${currentEstimate}`);

            // 3. Logic: If status is 'Need Estimation' and Estimate is a number, move to 'To Do'
            if (currentStatus === FROM_STATUS && typeof currentEstimate === 'number') {
              await github.graphql(`
                mutation ($proj: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $proj,
                    itemId: $item,
                    fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                proj: project.id,
                item: itemId,
                field: statusField.id,
                option: todoOption.id
              });
              console.log("Successfully moved to To Do!");
            } else {
              console.log("Conditions not met for move.");
            }