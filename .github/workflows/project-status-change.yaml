name: Auto update project status from estimate

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: 'Project number to scan'
        required: true
        default: '1'
  schedule:
    - cron: "*/5 * * * *"

permissions:
  repository-projects: write
  contents: read

jobs:
  auto-move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const PROJECT_NUMBER = 1; 
            const STATUS_FIELD = "Status";
            const ESTIMATE_FIELD = "Estimate";
            const FROM_STATUS = "Need Estimation";
            const TO_STATUS = "To Do";

            const owner = context.repo.owner;

            const projectRes = await github.graphql(`
              query ($owner: String!) {
                organization(login: $owner) {
                  projectV2(number: ${PROJECT_NUMBER}) {
                    id
                    items(first: 50) {
                      nodes {
                        id
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field { name }
                              name
                            }
                            ... on ProjectV2ItemFieldTextValue {
                              field { name }
                              text
                            }
                          }
                        }
                      }
                    }
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                        ... on ProjectV2TextField {
                          id
                          name
                        }
                        ... on ProjectV2NumberField {
                          id
                          name
                        }
                        ... on ProjectV2IterationField {
                          id
                          name
                        }
                        ... on ProjectV2DateField {
                          id
                          name
                        }
                        ... on ProjectV2LabelField {
                          id
                          name
                        }
                      }
                    }
                    }
                  }
                }
              }
            `, { owner });

            const project = projectRes.organization.projectV2;
            const statusField = project.fields.nodes.find(f => f.name === STATUS_FIELD);
            const estimateField = project.fields.nodes.find(f => f.name === ESTIMATE_FIELD);
            const todoOption = statusField.options.find(o => o.name === TO_STATUS);

            if (!statusField || !estimateField || !todoOption) return;

            for (const item of project.items.nodes) {
              let statusValue = null;
              let estimateValue = null;

              for (const v of item.fieldValues.nodes) {
                if (v.field?.name === STATUS_FIELD) statusValue = v.name;
                if (v.field?.name === ESTIMATE_FIELD) estimateValue = v.text;
              }

              if (statusValue === FROM_STATUS && estimateValue && estimateValue.trim() !== "") {
                await github.graphql(`
                  mutation {
                    updateProjectV2ItemFieldValue(
                      input: {
                        projectId: "${project.id}"
                        itemId: "${item.id}"
                        fieldId: "${statusField.id}"
                        value: { singleSelectOptionId: "${todoOption.id}" }
                      }
                    ) {
                      projectV2Item { id }
                    }
                  }
                `);
                console.log(`Item ${item.id}: Status updated to To Do`);
              }
            }