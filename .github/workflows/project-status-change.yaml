name: Auto update project status from estimate

on:
  workflow_dispatch:
    inputs:
      project_number:
        description: 'Project number to scan'
        required: true
        default: '1'
  # schedule:
  #   - cron: "0 * * * *"

permissions:
  repository-projects: write
  contents: read

jobs:
  auto-move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_AUTOMATION_TOKEN }}
          script: |
            const PROJECT_NUMBER = parseInt(context.payload.inputs?.project_number || '1', 10); 
            const STATUS_FIELD = "Status";
            const ESTIMATE_FIELD = "Estimate";
            const FROM_STATUS = "Need Estimation";
            const TO_STATUS = "To Do";
            const owner = context.repo.owner;

            const projectRes = await github.graphql(`
              query ($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField { id name options { id name } }
                        ... on ProjectV2Field { id name }
                      }
                    }
                  }
                }
              }
            `, { owner, number: PROJECT_NUMBER });

            const project = projectRes.user.projectV2;
            if (!project) return console.log("Project not found.");

            const statusField = project.fields.nodes.find(f => f.name === STATUS_FIELD);
            const todoOption = statusField?.options?.find(o => o.name === TO_STATUS);
            if (!statusField || !todoOption) return console.log("Fields or 'To Do' option not found.");

            let itemsToProcess = [];
            if (context.payload.projects_v2_item) {
              const itemId = context.payload.projects_v2_item.node_id;
              const itemRes = await github.graphql(`
                query ($item: ID!) {
                  node(id: $item) {
                    ... on ProjectV2Item {
                      id
                      fieldValues(first: 20) {
                        nodes {
                          ... on ProjectV2ItemFieldSingleSelectValue { field { ... on ProjectV2FieldCommon { name } } name }
                          ... on ProjectV2ItemFieldNumberValue { field { ... on ProjectV2FieldCommon { name } } number }
                          ... on ProjectV2ItemFieldTextValue { field { ... on ProjectV2FieldCommon { name } } text }
                        }
                      }
                    }
                  }
                }
              `, { item: itemId });
              if (itemRes.node) itemsToProcess.push(itemRes.node);
            } else {
              const boardRes = await github.graphql(`
                query ($owner: String!, $number: Int!) {
                  user(login: $owner) {
                    projectV2(number: $number) {
                      items(first: 100) {
                        nodes {
                          id
                          fieldValues(first: 20) {
                            nodes {
                              ... on ProjectV2ItemFieldSingleSelectValue { field { ... on ProjectV2FieldCommon { name } } name }
                              ... on ProjectV2ItemFieldNumberValue { field { ... on ProjectV2FieldCommon { name } } number }
                              ... on ProjectV2ItemFieldTextValue { field { ... on ProjectV2FieldCommon { name } } text }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner, number: PROJECT_NUMBER });
              itemsToProcess = boardRes.user.projectV2.items.nodes;
            }

            for (const item of itemsToProcess) {
              let currentStatus = null;
              let currentEstimate = null;

              for (const val of item.fieldValues.nodes) {
                const fieldName = val.field?.name;
                if (fieldName === STATUS_FIELD) currentStatus = val.name;
                
                if (fieldName === ESTIMATE_FIELD) {
                    currentEstimate = val.number ?? val.text ?? val.name;
                }
              }

              console.log(`Checking Item ${item.id}: Status='${currentStatus}', Estimate='${currentEstimate}'`);

              if (currentStatus === FROM_STATUS && currentEstimate !== null && currentEstimate !== "") {
                console.log("Match! Updating to To Do...");
                await github.graphql(`
                  mutation ($proj: ID!, $item: ID!, $field: ID!, $option: String!) {
                    updateProjectV2ItemFieldValue(input: {
                      projectId: $proj, itemId: $item, fieldId: $field,
                      value: { singleSelectOptionId: $option }
                    }) { projectV2Item { id } }
                  }
                `, { proj: project.id, item: item.id, field: statusField.id, option: todoOption.id });
              }
            }
